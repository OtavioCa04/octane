# Octane: liga o .htaccess do site e serve as fotos enviadas a partir do volume.

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Fotos dos usuários (volume do Railway montado em /data/uploads): só imagem, nada executa aqui
Alias /uploads /data/uploads
<Directory /data/uploads>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>

    <FilesMatch "\.(?i:php\d?|phtml|phar|cgi|pl|py|sh|html?|svg)$">
        Require all denied
    </FilesMatch>

    Header set Cache-Control "public, max-age=2592000"
    Header always set X-Content-Type-Options "nosniff"
</Directory>
